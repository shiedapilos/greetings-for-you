<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dust" id="dust" aria-hidden="true"></div>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <div class="stage" id="stage">
      <p class="hint" id="hint">Tap the envelope to open it</p>

      <div class="envelope-wrap">
        <button class="envelope" id="envelope" aria-label="Open birthday card">
          <div class="envelope-back"></div>

          <div class="letter">
            <div class="letter-content">
              <h1>Happy Birthday Ma!</h1>
              <p>May God bless you always with love, peace, and happiness 🙏✨</p>
            </div>
          </div>

          <div class="envelope-pocket"></div>
          <div class="envelope-flap"></div>

          <div class="seal" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 21s-7.5-4.7-10-9.3C.3 8.1 2.1 4.5 5.6 4c2-.3 3.7.6 4.9 2.1a.6.6 0 0 0 .9 0C12.7 4.6 14.4 3.7 16.4 4c3.5.5 5.3 4.1 3.6 7.7C17.5 16.3 12 21 12 21z"
                fill="#fff8ed"
              />
            </svg>
          </div>
        </button>
      </div>

      <button class="replay" id="replay">Seal it back up</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
